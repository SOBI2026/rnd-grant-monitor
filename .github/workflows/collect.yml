name: collect

on:
  schedule:
    - cron: "50 21 * * *"   # 매일 06:50 KST
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ["src/**", "config/**", ".github/workflows/collect.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect and classify
        run: python src/run.py

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST [skip ci]"
            git push
          fi

      - name: Notify via issue
        if: hashFiles('notify.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "과제 모니터링 $(date -u -d '+9 hours' '+%Y-%m-%d')" \
            --body-file notify.md
