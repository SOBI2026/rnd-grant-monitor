name: source-probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paging test
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          mkdir -p raw4; cd raw4
          curl -sS -L -A "$UA" -c iris.jar -o /dev/null "https://www.iris.go.kr/contents/retrieveBsnsAncmBtinSituListView.do"
          for p in "pageUnit=100" "recordCountPerPage=100" "pageUnit=100&recordCountPerPage=100" "pageSize=100&pageUnit=100"; do
            f=$(echo "$p" | tr '&=' '__')
            /usr/bin/time -f "$f %e s" curl -sS -L -A "$UA" -b iris.jar -X POST -H "X-Requested-With: XMLHttpRequest" --data "ancmPrg=ancmEnd&pageIndex=1&blngGovdSeArr=AR4012&$p" -o "end_$f.json" "https://www.iris.go.kr/contents/retrieveBsnsAncmBtinSituList.do" 2>> timing.txt
          done
          /usr/bin/time -f "all_end %e s" curl -sS -L -A "$UA" -b iris.jar -X POST -H "X-Requested-With: XMLHttpRequest" --data "ancmPrg=ancmEnd&pageIndex=1" -o "end_all.json" "https://www.iris.go.kr/contents/retrieveBsnsAncmBtinSituList.do" 2>> timing.txt
          /usr/bin/time -f "pre %e s" curl -sS -L -A "$UA" -b iris.jar -X POST -H "X-Requested-With: XMLHttpRequest" --data "ancmPrg=ancmPre&pageIndex=1" -o "pre.json" "https://www.iris.go.kr/contents/retrieveBsnsAncmBtinSituList.do" 2>> timing.txt
          rm -f *.jar; cat timing.txt
      - name: Save
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A raw4; git commit -m "raw4 [skip ci]"; git push
