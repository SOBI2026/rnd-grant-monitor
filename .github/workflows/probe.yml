name: source-probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch KHIDI detail
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          mkdir -p raw3; cd raw3
          curl -sS -L -A "$UA" -c ht.jar -o /dev/null "https://www.htdream.kr/"
          for id in 8906 8926; do
            curl -sS -L -A "$UA" -b ht.jar -X POST -H "X-Requested-With: XMLHttpRequest" -H "Referer: https://www.htdream.kr/" --data "pbanId=$id" -o "pban_$id.html" "https://www.htdream.kr/mypage/selectBsnsPbanViewAjax.do"
          done
          curl -sS -L -A "$UA" -c iris.jar -o /dev/null "https://www.iris.go.kr/contents/retrieveBsnsAncmBtinSituListView.do"
          curl -sS -L -A "$UA" -b iris.jar -X POST -H "X-Requested-With: XMLHttpRequest" --data "ancmPrg=ancmEnd&pageIndex=1&blngGovdSeArr=AR4012" -o iris_mohw_end.json "https://www.iris.go.kr/contents/retrieveBsnsAncmBtinSituList.do"
          curl -sS -L -A "$UA" -b iris.jar -X POST -H "X-Requested-With: XMLHttpRequest" --data "ancmPrg=ancmEnd&pageIndex=1&sorgnIdArr=10008" -o iris_khidi_end.json "https://www.iris.go.kr/contents/retrieveBsnsAncmBtinSituList.do"
          rm -f *.jar; ls -la
      - name: Save
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A raw3; git commit -m "raw3 [skip ci]"; git push
