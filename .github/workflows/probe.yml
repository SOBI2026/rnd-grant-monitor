name: source-probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save raw pages
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          mkdir -p raw
          g() { curl -sS -L -A "$UA" --max-time 30 -o "raw/$1" "$2" || echo "fail $1" >> raw/errors.txt; }
          g iris_main.html   "https://www.iris.go.kr/main.do"
          g iris_list.html   "https://www.iris.go.kr/contents/retrieveBsnsAncmBtinSituListView.do"
          g htdream.html     "https://www.htdream.kr/"
          g kddf.html        "https://www.kddf.org/"
          g kmdf.html        "https://www.kmdf.org/"
          g ntis_api.html    "https://www.ntis.go.kr/rndopen/api/mng/apiMain.do"
          g mohw.html        "https://www.mohw.go.kr/"
          ls -la raw
      - name: Save result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add raw
          git commit -m "raw pages [skip ci]"
          git push
